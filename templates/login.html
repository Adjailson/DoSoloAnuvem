<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do Solo à Nuvem - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
    <div class="container">
        <h1>Do Solo à Nuvem</h1>
        <div class="card">
            <div class="left">
                <h2>Bem-vindo de volta</h2>
                <p>Acesse sua conta</p>
                <button class="btn" onclick="document.querySelector('form').submit();">ENTRAR</button>
            </div>
            <div class="right">
                <form method="POST">
                    <label>
                        <input type="email" name="email" placeholder="E-mail" required>
                    </label>
                    <label>
                        <input type="password" name="senha" placeholder="Senha" required>
                    </label>
                </form>
            </div>
        </div>
        <div class="link">
            <a href="{{ url_for('registro') }}">Criar uma conta</a>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul>
              {% for message in messages %}
                <li style="color:red;">{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
    </div>
</body>
</html>
